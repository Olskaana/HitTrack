<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="916" viewBox="0 0 1000 916" role="img" aria-labelledby="title desc">
<title id="title">Fluxo 1 | Registrar luta e importar hits</title>
<desc id="desc">Cadastro da luta, validação pela API e envio de vídeo ou eventos JSON.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0.5 L 12 6 L 0 11.5 z" fill="#667b86"/></marker><marker id="er-one" viewBox="0 0 20 20" refX="0" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto"><path d="M 8 2 V 18 M 13 2 V 18" stroke="#667b86" stroke-width="2" fill="none"/></marker><marker id="er-many" viewBox="0 0 20 20" refX="20" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto"><path d="M 4 10 L 20 2 M 4 10 L 20 18 M 4 10 H 20 M 3 2 V 18" stroke="#667b86" stroke-width="2" fill="none"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172b3a">Fluxo 1 | Registrar luta e importar hits</text>
<path d="M 280 166 L 280 230" fill="none" stroke="#667b86" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 280 306 L 280 370" fill="none" stroke="#667b86" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 280 446 L 280 510" fill="none" stroke="#667b86" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 280 586 L 280 650" fill="none" stroke="#667b86" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 280 726 L 280 790" fill="none" stroke="#667b86" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 430 408 L 570 408" fill="none" stroke="#667b86" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="130" y="90" width="300" height="76" rx="38.0" fill="#e7f5f3" stroke="#328c83" stroke-width="2"/>
<text x="280.0" y="132.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#243b49">Analista inicia cadastro</text>
<rect x="130" y="230" width="300" height="76" rx="12" fill="#f2efff" stroke="#7761b1" stroke-width="2"/>
<text x="280.0" y="263.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#243b49">Informa competição, categoria,</text>
<text x="280.0" y="282.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#243b49">robôs, equipes, duração e FPS</text>
<rect x="130" y="370" width="300" height="76" rx="12" fill="#f2efff" stroke="#7761b1" stroke-width="2"/>
<text x="280.0" y="403.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#243b49">API valida os dados</text>
<text x="280.0" y="422.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#243b49">e salva a luta</text>
<rect x="130" y="510" width="300" height="76" rx="12" fill="#f2efff" stroke="#7761b1" stroke-width="2"/>
<text x="280.0" y="552.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#243b49">Envia vídeo ou eventos JSON</text>
<rect x="130" y="650" width="300" height="76" rx="12" fill="#f2efff" stroke="#7761b1" stroke-width="2"/>
<text x="280.0" y="683.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#243b49">Valida tipo/robôs, remove duplicatas</text>
<text x="280.0" y="702.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#243b49">e associa dados à luta</text>
<rect x="130" y="790" width="300" height="76" rx="38.0" fill="#e8f7f0" stroke="#3b8b68" stroke-width="2"/>
<text x="280.0" y="823.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#243b49">Luta e dados disponíveis</text>
<text x="280.0" y="842.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#243b49">para consulta</text>
<rect x="570" y="370" width="300" height="76" rx="12" fill="#fff0ee" stroke="#c95d4e" stroke-width="2"/>
<text x="720.0" y="403.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#243b49">Retorna erro de validação</text>
<text x="720.0" y="422.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#243b49">sem aceitar o payload</text>
<text x="280.0" y="482.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#3d525d" paint-order="stroke" stroke="#ffffff" stroke-width="8" stroke-linejoin="round">dados válidos</text>
<text x="500.0" y="412.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#3d525d" paint-order="stroke" stroke="#ffffff" stroke-width="8" stroke-linejoin="round">inválidos</text>
</svg>
