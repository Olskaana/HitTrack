<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 970" role="img" aria-labelledby="title desc">
<title id="title">Fluxo 1 | Registrar luta e importar hits</title>
<desc id="desc">Diagrama com relações entre os componentes do HitTrack.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667b86"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="42" y="46" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b3a">Fluxo 1 | Registrar luta e importar hits</text>
<path d="M 600 160 L 600 205" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 600 305 L 600 350" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 600 450 L 600 495" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 725 400 L 865 400" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<text x="795" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#445963" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">inválidos</text>
<path d="M 600 595 L 600 640" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 600 740 L 600 780" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="475" y="60" width="250" height="100" rx="14" fill="#e7f5f3" stroke="#328c83" stroke-width="2"/>
<text x="600" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Analista inicia cadastro</text>
<rect x="475" y="205" width="250" height="100" rx="14" fill="#f2efff" stroke="#7761b1" stroke-width="2"/>
<text x="600" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Informa competição, categoria,</text>
<text x="600" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">robôs, equipes, duração e FPS</text>
<rect x="475" y="350" width="250" height="100" rx="14" fill="#f2efff" stroke="#7761b1" stroke-width="2"/>
<text x="600" y="391" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">API valida os dados</text>
<text x="600" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">e salva a luta</text>
<rect x="475" y="495" width="250" height="100" rx="14" fill="#f2efff" stroke="#7761b1" stroke-width="2"/>
<text x="600" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Envia vídeo ou eventos JSON</text>
<rect x="475" y="640" width="250" height="100" rx="14" fill="#f2efff" stroke="#7761b1" stroke-width="2"/>
<text x="600" y="681" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Valida tipo/robôs, remove duplicatas</text>
<text x="600" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">e associa dados à luta</text>
<rect x="865" y="350" width="250" height="100" rx="14" fill="#fff0ee" stroke="#c95d4e" stroke-width="2"/>
<text x="990" y="391" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Retorna erro de validação</text>
<text x="990" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">sem aceitar o payload</text>
<rect x="475" y="780" width="250" height="100" rx="14" fill="#e8f7f0" stroke="#3b8b68" stroke-width="2"/>
<text x="600" y="821" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Luta e dados disponíveis</text>
<text x="600" y="840" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">para consulta</text>
</svg>
