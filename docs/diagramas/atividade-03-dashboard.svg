<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 970" role="img" aria-labelledby="title desc">
<title id="title">Fluxo 3 | Consultar dashboard e histórico</title>
<desc id="desc">Diagrama com relações entre os componentes do HitTrack.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667b86"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="42" y="46" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b3a">Fluxo 3 | Consultar dashboard e histórico</text>
<path d="M 600 160 L 600 205" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 600 305 L 600 350" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 600 450 L 600 495" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 600 595 L 600 640" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 475 690 L 485 835" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="755.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#445963" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">encerrada</text>
<path d="M 725 690 L 715 835" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<text x="720" y="755.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#445963" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">em andamento</text>
<rect x="475" y="60" width="250" height="100" rx="14" fill="#e7f5f3" stroke="#328c83" stroke-width="2"/>
<text x="600" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Analista abre uma tela</text>
<text x="600" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">ou seleciona filtros</text>
<rect x="475" y="205" width="250" height="100" rx="14" fill="#f2efff" stroke="#7761b1" stroke-width="2"/>
<text x="600" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Frontend solicita luta,</text>
<text x="600" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">histórico ou agregados</text>
<rect x="475" y="350" width="250" height="100" rx="14" fill="#f2efff" stroke="#7761b1" stroke-width="2"/>
<text x="600" y="391" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">API consulta e filtra dados</text>
<text x="600" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">persistidos</text>
<rect x="475" y="495" width="250" height="100" rx="14" fill="#f2efff" stroke="#7761b1" stroke-width="2"/>
<text x="600" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Calcula comparações,</text>
<text x="600" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">linhas do tempo e cobertura</text>
<rect x="475" y="640" width="250" height="100" rx="14" fill="#f2efff" stroke="#7761b1" stroke-width="2"/>
<text x="600" y="681" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Frontend exibe gráficos,</text>
<text x="600" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">tabelas e histórico</text>
<rect x="235" y="785" width="250" height="100" rx="14" fill="#e8f7f0" stroke="#3b8b68" stroke-width="2"/>
<text x="360" y="826" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Luta encerrada:</text>
<text x="360" y="845" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">mostra sugestões pós-luta</text>
<rect x="715" y="785" width="250" height="100" rx="14" fill="#fff7e8" stroke="#c78624" stroke-width="2"/>
<text x="840" y="826" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Luta em andamento:</text>
<text x="840" y="845" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">mostra estado sem sugestões</text>
</svg>
