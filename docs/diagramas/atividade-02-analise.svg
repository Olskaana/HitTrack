<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1010" role="img" aria-labelledby="title desc">
<title id="title">Fluxo 2 | Analisar vídeo e calcular métricas</title>
<desc id="desc">Diagrama com relações entre os componentes do HitTrack.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667b86"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="42" y="46" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b3a">Fluxo 2 | Analisar vídeo e calcular métricas</text>
<path d="M 600 160 L 600 205" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 600 305 L 600 360" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 725 255 L 875 255" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<text x="800" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#445963" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">falha</text>
<path d="M 600 460 L 600 515" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 600 615 L 600 670" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 600 770 L 600 825" fill="none" stroke="#667b86" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="475" y="60" width="250" height="100" rx="14" fill="#e7f5f3" stroke="#328c83" stroke-width="2"/>
<text x="600" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Analista solicita análise</text>
<rect x="475" y="205" width="250" height="100" rx="14" fill="#f2efff" stroke="#7761b1" stroke-width="2"/>
<text x="600" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">API verifica luta, vídeo</text>
<text x="600" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">e detector configurado</text>
<rect x="875" y="205" width="250" height="100" rx="14" fill="#fff0ee" stroke="#c95d4e" stroke-width="2"/>
<text x="1000" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Informa vídeo ausente</text>
<text x="1000" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">ou dependência indisponível</text>
<rect x="475" y="360" width="250" height="100" rx="14" fill="#fff7e8" stroke="#c78624" stroke-width="2"/>
<text x="600" y="401" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Worker processa vídeo</text>
<text x="600" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">e identifica eventos</text>
<rect x="475" y="515" width="250" height="100" rx="14" fill="#f2efff" stroke="#7761b1" stroke-width="2"/>
<text x="600" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Persiste hits não duplicados</text>
<text x="600" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">associados à luta</text>
<rect x="475" y="670" width="250" height="100" rx="14" fill="#f2efff" stroke="#7761b1" stroke-width="2"/>
<text x="600" y="711" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Agrupa hits por robô e período;</text>
<text x="600" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">calcula métricas</text>
<rect x="475" y="825" width="250" height="100" rx="14" fill="#e8f7f0" stroke="#3b8b68" stroke-width="2"/>
<text x="600" y="866" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#243b49">Encerra luta e disponibiliza</text>
<text x="600" y="885" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#243b49">resultado/análise</text>
</svg>
