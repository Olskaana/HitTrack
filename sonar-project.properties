sonar.sources=backend,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*.py,frontend/src/**/*.test.jsx
sonar.exclusions=hitcount-ia/**,backend/tests/**,frontend/src/**/*.test.jsx,**/.venv/**,**/__pycache__/**,frontend/node_modules/**,frontend/dist/**,frontend/coverage/**,**/*.pyc
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
